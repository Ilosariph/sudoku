<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f0e8">
  <title>Sudoku</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23c45d3e'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E9%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Su<span>doku</span></h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="scan-btn" title="Scan a puzzle from a photo" aria-label="Scan a puzzle from a photo"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.5l1.5-2h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button class="icon-btn" id="stats-btn" title="Best times" aria-label="Best times">&#9733;</button>
        <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">&#9790;</button>
      </div>
    </header>

    <section class="setup">
      <div class="segmented" role="radiogroup" aria-label="Mode">
        <button role="radio" data-mode="lives">&#9829; Lives</button>
        <button role="radio" data-mode="normal">&#9998; Normal</button>
      </div>
      <select id="difficulty" aria-label="Difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
        <option value="expert">Expert</option>
        <option value="scanned" hidden>Scanned</option>
      </select>
      <button class="primary" id="new-btn">New game</button>
    </section>

    <section class="status">
      <span id="difficulty-label" class="pill"></span>
      <span id="lives" class="lives" aria-label="Lives"></span>
      <span class="timer-wrap">
        <span id="timer">00:00</span>
        <button class="icon-btn small" id="pause-btn" title="Pause" aria-label="Pause"></button>
      </span>
    </section>

    <div class="board-wrap">
      <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
      <div id="pause-overlay" class="overlay" hidden>
        <button class="primary" id="resume-btn">▶ Resume</button>
      </div>
    </div>

    <section class="actions">
      <button class="action" id="undo-btn"><span class="ico">↶</span><span>Undo</span></button>
      <button class="action" id="erase-btn"><span class="ico">⌫</span><span>Erase</span></button>
      <button class="action" id="notes-btn" aria-pressed="false"><span class="ico">✎</span><span>Notes <b class="badge">off</b></span></button>
      <button class="action" id="hint-btn"><span class="ico">?</span><span>Hint</span></button>
    </section>

    <section class="actions normal-only">
      <button class="action wide" id="check-btn"><span class="ico">✔</span><span>Check</span></button>
      <button class="action wide" id="mistakes-btn" aria-pressed="false"><span class="ico">⚠</span><span>Show mistakes</span></button>
    </section>

    <section id="numpad" class="numpad" aria-label="Number input"></section>
  </main>

  <main class="app scan-view" id="scan-view" hidden>
    <header class="topbar">
      <h1>Scan<span> puzzle</span></h1>
      <div class="topbar-actions">
        <button class="icon-btn" id="scan-close" title="Back to game" aria-label="Back to game">&#10005;</button>
      </div>
    </header>

    <section class="setup">
      <label class="primary file-btn">&#128247; Take photo
        <input type="file" id="scan-camera" accept="image/*" capture="environment" hidden>
      </label>
      <label class="secondary file-btn">&#128444; Choose image
        <input type="file" id="scan-file" accept="image/*" hidden>
      </label>
    </section>

    <div class="scan-photo" id="scan-photo" hidden>
      <canvas id="scan-canvas"></canvas>
      <p class="scan-hint">Drag the corners onto the outer edge of the grid if they're off.</p>
    </div>

    <p class="scan-hint" id="scan-intro">Take a photo of a printed sudoku, or type the digits in below. Fix any misread digits before you start.</p>

    <div id="scan-board" class="board" role="grid" aria-label="Scanned puzzle"></div>

    <p class="scan-status" id="scan-status" role="status"></p>

    <section id="scan-numpad" class="numpad" aria-label="Number input"></section>

    <section class="actions">
      <button class="action wide" id="scan-erase"><span class="ico">&#9003;</span><span>Erase</span></button>
      <button class="action wide" id="scan-clear"><span class="ico">&#8635;</span><span>Clear all</span></button>
    </section>

    <button class="primary start-btn" id="scan-start" disabled>Start</button>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="dialog">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body"></div>
      <menu id="dialog-buttons"></menu>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
